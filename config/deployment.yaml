# SHADE Deployment Configuration — Stage 0
# Primary target: Raspberry Pi 5 (8GB), CPU inference only

device:
  hardware: raspberry_pi
  name: "shade-pi5-dev"
  # Future: "jetson_nano", "jetson_xavier", "jetson_orin"

inference:
  backend: onnxruntime            # onnxruntime | tflite | openvino | tensorrt
  model_path: models/yolov8n.onnx # Relative to project root
  input_size: 640
  conf_threshold: 0.25
  iou_threshold: 0.45
  num_threads: 4                  # Pi 5 has 4× Cortex-A76

camera:
  source: 0                       # 0 = first USB/CSI camera, or path to video file
  display: true                   # false for headless operation
  max_frames: 0                   # 0 = unlimited

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
