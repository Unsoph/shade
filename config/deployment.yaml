# SHADE deployment configuration. Anything omitted falls back to
# src/core/defaults.py. Paths are relative to the project root.

device:
  hardware: raspberry_pi        # raspberry_pi | jetson | generic | simulated
  name: "shade-pi5-dev"

inference:
  backend: onnxruntime          # onnxruntime | tflite | openvino | tensorrt | fake
  model_path: models/yolov8n.onnx
  input_size: 640
  conf_threshold: 0.25
  iou_threshold: 0.45
  num_threads: 4                # Pi 5 has 4x Cortex-A76

camera:
  source: 0                     # index, video path, rtsp:// URL, or synthetic
  display: true                 # false for headless operation
  max_frames: 0                 # 0 = unlimited
  reconnect: true               # reopen the camera after read failures
  reconnect_initial_s: 1.0
  reconnect_max_s: 30.0
  loop_video: false

# Degradation ladder, best first. Rungs whose model file is missing are
# skipped, so the ladder is whatever is on disk. Generate the 320 and INT8
# models with scripts/export_models.py and scripts/quantize_int8.py.
ladder:
  - {name: nominal,    model: models/yolov8n.onnx,          input_size: 640, detect_every: 1}
  - {name: frame-skip, model: models/yolov8n.onnx,          input_size: 640, detect_every: 2}
  - {name: small-320,  model: models/yolov8n_320.onnx,      input_size: 320, detect_every: 2}
  - {name: emergency,  model: models/yolov8n_320_int8.onnx, input_size: 320, detect_every: 3}

ladder_settings:
  min_free_mb_after_load: 300   # refuse a preload that would leave less RAM
  memory_factor: 3.0            # estimated RAM = model file size * factor
  warmup: true                  # one dummy inference before swapping in
  preload_nice: 10              # niceness of the preload thread (untuned)

# Decision policy. Temperature bands are degrees C. Defaults follow the
# Pi 5's ~80C soft limit; tune per enclosure and ambient with real data.
policy:
  poll_interval_s: 1.0
  warm_c: 70.0
  degrade_c: 75.0
  critical_c: 80.0
  upgrade_gate_c: 65.0          # upgrades only at or below this temperature
  rise_c_per_s: 0.5             # anticipation: rising this fast while warm
  slope_window_s: 10.0
  mem_warn_pct: 85.0
  mem_crit_pct: 92.0
  swap_warn_pct: 10.0
  swap_crit_pct: 30.0
  min_fps: 0.0                  # >0 enables an FPS floor signal
  fps_grace_s: 15.0
  confirm_samples: 3            # consecutive samples before degrading
  dwell_s: 10.0                 # min time since last change before degrading
  cooldown_s: 20.0              # min time since last change before upgrading
  recover_hold_s: 30.0          # continuous calm needed per upgrade step
  level_to_rung: [0, 1, 2, 3]   # pressure level -> minimum rung
  db_path: logs/shade.db
  forecast:                     # EXPERIMENTAL: learned thermal model (docs/RESULTS_SIM.md)
    enabled: false              # priors below are unmeasured guesses
    target_c: 68.0              # keep the forecast under this (below warm_c)
    horizon_s: 1800.0           # how far ahead the forecast must hold
    z: 1.0                      # uncertainty margin, standard deviations
    upgrade_margin_c: 2.0       # extra headroom needed to move up a rung
    tau_s: 90.0
    ambient_c: 25.0
    k_c: 60.0

input:
  enabled: true
  frozen_s: 5.0
  frozen_eps: 0.02
  dark_level: 8.0
  dark_s: 5.0
  lost_s: 3.0
  reopen_cooldown_s: 30.0

runtime:
  max_consecutive_errors: 5     # then the process exits and the watchdog restarts it

# Detector scheduling inside each rung's budget (src/video/scheduler.py).
scheduling:
  gate: false                   # stretch detect_every while the scene is static
  shift: false                  # move boxes with the scene on skipped frames
  motion_threshold: 2.0         # mean grey-level change (0-255) counted as motion
  static_factor: 4              # max stretch of detect_every while static
  min_response: 0.15            # phase-correlation confidence to trust a shift

observability:                  # read-only HTTP: /, /status, /decisions, /metrics, /healthz
  enabled: false                # or run with --serve [PORT]
  host: 127.0.0.1               # unauthenticated: only widen on a trusted network
  port: 9108
  decisions_limit: 50

simulation:                     # used when hardware: simulated or --simulate
  scenario: nominal
  speed: 1.0

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
